name: shopping_agent_app
description: "AI Shopper — chat about what you need and compare the best deals across Amazon, Flipkart & the web."
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Networking
  http: ^1.6.0

  # Open product URLs in the store app / browser
  url_launcher: ^6.3.0

  # Anonymous per-install ID for private search history
  shared_preferences: ^2.3.0

  # Product image caching
  cached_network_image: ^3.4.1

  # Typography
  google_fonts: ^6.2.1

  # Micro-animations
  flutter_animate: ^4.5.0

  # Number & date formatting
  intl: ^0.20.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
