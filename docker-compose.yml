
services:
  db:
    image: postgres:16-alpine
    container_name: shopping_db
    restart: unless-stopped
    environment:
      POSTGRES_USER:     shopping
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       shopping_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopping -d shopping_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shopping_api
    restart: unless-stopped
    ports:
      - "8000:8000"
      - "8765:8765"
    environment:
      DATABASE_URL:            postgresql://shopping:${POSTGRES_PASSWORD}@db:5432/shopping_db
      NVIDIA_API_KEY:          ${NVIDIA_API_KEY}
      NVIDIA_BASE_URL:         ${NVIDIA_BASE_URL}
      NVIDIA_MODEL:            ${NVIDIA_MODEL:-meta/llama-3.1-8b-instruct}
      ALLOWED_ORIGINS:         ${ALLOWED_ORIGINS:-*}
      SCRAPE_TIMEOUT_SECONDS:  ${SCRAPE_TIMEOUT_SECONDS:-60}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    volumes:
      - ./results:/app/results

volumes:
  postgres_data:
    driver: local
