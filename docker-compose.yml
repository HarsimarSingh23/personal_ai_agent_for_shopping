services:
  db:
    image: postgres:16-alpine
    container_name: shopping_db
    restart: unless-stopped
    environment:
      POSTGRES_USER:     shopping
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB:       shopping_db
    # Not published to the host: only the api service can reach the database.
    # For local debugging, uncomment to expose it on localhost only:
    # ports:
    #   - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopping -d shopping_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_MONITORING: ${INSTALL_MONITORING:-false}
    container_name: shopping_api
    restart: unless-stopped
    ports:
      - "8000:8000"
      # AgentMonitor dashboard shows user queries — keep it on localhost.
      - "127.0.0.1:8765:8765"
    environment:
      APP_ENV:                    ${APP_ENV:-production}
      DATABASE_URL:               postgresql://shopping:${POSTGRES_PASSWORD}@db:5432/shopping_db
      API_KEY:                    ${API_KEY:-}
      ALLOWED_ORIGINS:            ${ALLOWED_ORIGINS:-*}
      LLM_PROVIDER:               ${LLM_PROVIDER:-nvidia}
      NVIDIA_API_KEY:             ${NVIDIA_API_KEY:-}
      NVIDIA_BASE_URL:            ${NVIDIA_BASE_URL:-https://integrate.api.nvidia.com/v1}
      NVIDIA_MODEL:               ${NVIDIA_MODEL:-meta/llama-3.1-8b-instruct}
      GEMINI_API_KEY:             ${GEMINI_API_KEY:-}
      LLM_TIMEOUT_SECONDS:        ${LLM_TIMEOUT_SECONDS:-30}
      SCRAPE_TIMEOUT_SECONDS:     ${SCRAPE_TIMEOUT_SECONDS:-45}
      RATE_LIMIT_SEARCH_PER_MIN:  ${RATE_LIMIT_SEARCH_PER_MIN:-10}
      RATE_LIMIT_CHAT_PER_MIN:    ${RATE_LIMIT_CHAT_PER_MIN:-30}
      LOG_FORMAT:                 ${LOG_FORMAT:-json}
      AGENT_MONITOR:              ${AGENT_MONITOR:-0}
      WEB_CONCURRENCY:            ${WEB_CONCURRENCY:-1}
      FORWARDED_ALLOW_IPS:        ${FORWARDED_ALLOW_IPS:-127.0.0.1}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  postgres_data:
    driver: local
