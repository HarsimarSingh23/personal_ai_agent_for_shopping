name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt pyflakes
      - run: python -m pyflakes *.py tests/*.py
      - run: python -m pytest -q

  flutter:
    name: Flutter analyze & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shopping_agent_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  docker:
    name: Docker image builds and starts
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t shopping-agent-api:ci .
      # Start the real stack (API + PostgreSQL) and wait for /health, so a crash
      # on start (e.g. a missing database driver) fails CI instead of the demo.
      - name: Start with PostgreSQL and check /health
        env:
          POSTGRES_PASSWORD: ci-password
        run: |
          docker compose up --build -d
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then echo; exit 0; fi
            sleep 2
          done
          docker compose logs api
          exit 1
      - name: Stop the stack
        if: always()
        run: docker compose down -v
